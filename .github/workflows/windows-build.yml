name: DeiLaw Windows candidate (unsigned)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (!(Test-Path "$nsis\makensis.exe")) { throw 'NSIS compiler not installed' }
          "$nsis" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Create isolated venv
        shell: pwsh
        run: python -m venv .venv
      - name: Tests and unsigned Windows setup
        shell: pwsh
        run: .\scripts\build_signpath_candidate.ps1
      - name: Upload candidate, never public release
        uses: actions/upload-artifact@v4
        with:
          name: Deilaw-unsigned-candidate
          path: |
            release/DeiLaw_Setup_v0.3.1.exe
            release/build_inventory.json
          if-no-files-found: error
          retention-days: 7
