name: Restore original WAV assets from DeiLaw 0.3.0
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-original-sounds.yml
permissions:
  contents: write
  actions: read
jobs:
  restore:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download historical extracted WAV artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/old-audio"
          gh run download 44779685580 -R DeiZiXX/DeiLaw -n historical-deilaw-audio -D "$RUNNER_TEMP/old-audio"
          test -f "$RUNNER_TEMP/old-audio/inventory.json"
      - name: Verify originals against all three historical versions
        shell: bash
        run: |
          python - <<'PY'
          import os, json, hashlib, wave
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'old-audio'
          found=json.loads((base/'inventory.json').read_text(encoding='utf-8-sig'))
          names=("click.wav","button.wav","toggle.wav","save.wav","memo_open.wav",
                 "memo_close.wav","law_update_complete.wav","ai_complete.wav")
          for item in found:
              if item["installer_exit_code"]!=0: raise RuntimeError("Original Inno installer failed")
          ref={v["name"].split("\\")[-1]: v["sha256"].lower() for v in
               next(x for x in found if x["version"]=="v0.3.0")["direct_audio"]}
          for name in names:
              if name not in ref: raise RuntimeError("Missing authentic historical sound "+name)
              shas=set()
              for version in ("v0.3.0","v0.2.2","v0.2.0"):
                  source=base/version/"_internal"/"assets"/"sounds"/name
                  raw=source.read_bytes()
                  sha=hashlib.sha256(raw).hexdigest()
                  shas.add(sha)
                  if len(raw)<1000 or raw[:4]!=b"RIFF" or raw[8:12]!=b"WAVE":
                      raise RuntimeError("Original is not WAV: "+name)
                  with wave.open(str(source),"rb") as w:
                      if w.getnframes()<100: raise RuntimeError("Invalid sound "+name)
              if shas!={ref[name]}: raise RuntimeError("Historical sound mismatch: "+name)
              target=Path("assets")/"sounds"/name
              target.write_bytes((base/"v0.3.0"/"_internal"/"assets"/"sounds"/name).read_bytes())
              print("RESTORED_OLD_SOUND",name,"SHA256",ref[name])
          policy=Path("docs/BRANDING_RELEASE_POLICY.md")
          contents=policy.read_text(encoding="utf-8")
          beginning=contents.index("**Происхождение звуков:**")
          ending=contents.index("\n\n",beginning)
          new=("**Происхождение звуков:** восемь оригинальных WAV-файлов интерфейса "
               "дословно восстановлены из официального установщика DeiLaw v0.3.0 "
               "(одинаковые SHA256 в установщиках v0.2.2 и v0.2.0). "
               "Оригинальный файл report_reply.wav сохранён. "
               "Три фирменных звука установщика отдельно созданы для версии с NSIS: "
               "оригинальные installer-WAV не найдены в установленных файлах старых версий.")
          policy.write_text(contents[:beginning]+new+contents[ending:],encoding="utf-8")
          PY
      - name: Commit exact historical original WAVs directly to main and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sounds docs/BRANDING_RELEASE_POLICY.md
          git rm -- .github/workflows/recover-legacy-audio.yml scripts/extract_historical_audio.py .github/workflows/restore-original-sounds.yml
          git diff --cached --stat
          git diff --cached --check
          git commit -m "Restore authentic DeiLaw sounds from official v0.3.0 installer"
          gh auth setup-git
          git push origin HEAD:main
